name: Android installable preview
on:
  push:
    branches: ['android/installable-preview']
    paths-ignore: ['**/*.md']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: whitedot-preview-debug-key-v1
      - name: Packaging contract and build APK
        env:
          ANDROID_BUILD_SHA: ${{ github.sha }}
        run: |
          node tests/android-package.mjs
          export ANDROID_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gradle -p android assembleDebug assembleDebugAndroidTest --no-daemon
          mkdir -p android-evidence
          cp android/app/build/outputs/apk/debug/app-debug.apk android-evidence/WHITEDOT-preview.apk
          sha256sum android-evidence/WHITEDOT-preview.apk > android-evidence/SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator — offline, controls, background, rotation and update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WHITEDOT-Android-preview
          path: android-evidence/
          retention-days: 30
