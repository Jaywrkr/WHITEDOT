name: Universe foundation checks
on:
  pull_request:
  push:
    branches: [main]
    # Documentation-only updates do not change the validated runtime.
    # Pull requests still run every suite without path filters.
    paths-ignore:
      - '**/*.md'
      - 'scripts/posmusica-*-validation.json'
      - 'scripts/posmusica-08-ci.json'
      - 'scripts/mejora-*-validation.json'
      - 'scripts/mejora-10-ci.json'
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run audit:release
      - run: npm test
      - run: node scripts/reencuentro-audit.mjs /tmp/reencuentro-audit.json
      - run: npm run audit:universe -- 2000 2
      - run: npm run audit:universe -- 2000 2 2 classic
  # The browser catalogue is split in six shards with one worker each: on one shared runner with two workers it took
  # about 38 of its 40 minutes and different flows lost races every run; with the places' smokes four shards passed
  # 30 minutes.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      WHITEDOT_BROWSER_SHARD: ${{ matrix.shard }}/6
      WHITEDOT_BROWSER_WORKERS: '1'
    steps:
      # pwa_updates_smoke.py archives the real pre-closure release from history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: npm run test:browser
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      WHITEDOT_AUDIO_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: npm run test:audio
  # Preserve the required check name: every browser flow and audio shard must pass.
  browser-audio:
    runs-on: ubuntu-latest
    needs: [browser, audio]
    if: always()
    env:
      WHITEDOT_BROWSER_RESULT: ${{ needs.browser.result }}
      WHITEDOT_AUDIO_RESULT: ${{ needs.audio.result }}
    steps:
      - run: |
          test "$WHITEDOT_BROWSER_RESULT" = success
          test "$WHITEDOT_AUDIO_RESULT" = success
