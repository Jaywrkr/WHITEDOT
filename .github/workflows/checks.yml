name: Universe foundation checks
on:
  pull_request:
  push:
    branches: [main, 'feat/posmusica-08-cierre', 'mejora/10-cierre', 'feat/ecosistemas-reactivos', 'feat/reencuentro-06-auditoria', 'feat/reencuentro-07-habitantes', 'feat/reencuentro-08-pulsos']
    # Documentation-only updates do not change the validated runtime.
    # Pull requests still run every suite without path filters.
    paths-ignore:
      - '**/*.md'
      - 'scripts/posmusica-*-validation.json'
      - 'scripts/posmusica-08-ci.json'
      - 'scripts/mejora-*-validation.json'
      - 'scripts/mejora-10-ci.json'
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run audit:release
      - run: npm test
      - run: node scripts/reencuentro-audit.mjs /tmp/reencuentro-audit.json
      - run: npm run audit:universe -- 2000 2
      - run: npm run audit:universe -- 2000 2 2 classic
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: npm run test:browser
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      WHITEDOT_AUDIO_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: npm run test:audio
  # Preserve the required check name: every browser flow and audio shard must pass.
  browser-audio:
    runs-on: ubuntu-latest
    needs: [browser, audio]
    if: always()
    env:
      WHITEDOT_BROWSER_RESULT: ${{ needs.browser.result }}
      WHITEDOT_AUDIO_RESULT: ${{ needs.audio.result }}
    steps:
      - run: |
          test "$WHITEDOT_BROWSER_RESULT" = success
          test "$WHITEDOT_AUDIO_RESULT" = success
